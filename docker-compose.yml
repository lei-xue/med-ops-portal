services:
  db:
    image: postgres:16-alpine
    container_name: medops-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medops
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - medops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medops"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-test:
    image: postgres:16-alpine
    container_name: medops-db-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medops_test
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medops_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  medops-pgdata:
