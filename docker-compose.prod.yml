# Production on littlecreek, behind the shared Cloudflare Tunnel in /opt/edge.
# No ports are published: cloudflared reaches the app over the external
# "edge" network as http://medops:3000. One-time setup: add the public
# hostname (medops.leixue.dev → http://medops:3000) to the tunnel in
# Zero Trust → Networks → Tunnels.
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
name: medops

services:
  db:
    image: postgres:16-alpine
    container_name: medops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-medops}
    volumes:
      - medops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-medops}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: medops-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medops}
      AUTH_SECRET: ${AUTH_SECRET:?set in .env.prod}
      AUTH_TRUST_HOST: "true"
      CLINIC_TIME_ZONE: ${CLINIC_TIME_ZONE:-America/New_York}
    networks:
      default:
      edge:
        aliases: [medops]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Migrations + seed run before Next starts listening.
      start_period: 60s

volumes:
  medops-pgdata:

networks:
  # Created once with `docker network create edge`; shared with cloudflared.
  edge:
    external: true
