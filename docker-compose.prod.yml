services:
  db:
    image: postgres:16-alpine
    container_name: medops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-medops}
    # loopback only — never exposed publicly
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - medops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-medops}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: medops-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medops}
      AUTH_SECRET: ${AUTH_SECRET:?set in .env.prod}
      AUTH_TRUST_HOST: "true"
    # loopback only — Caddy is the public entry
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    container_name: medops-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  medops-pgdata:
  caddy-data:
  caddy-config:
